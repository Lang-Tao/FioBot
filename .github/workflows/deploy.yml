name: Deploy to Aliyun

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

                        - name: Prepare remote directory
                            uses: appleboy/ssh-action@master
                            with:
                                    host: ${{ secrets.ALIYUN_HOST }}
                                    username: ${{ secrets.ALIYUN_USER }}
                                    key: ${{ secrets.ALIYUN_KEY }}
                                    script: |
                                            set -e
                                            mkdir -p /opt/fiobot

            - name: Copy files via SCP
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.ALIYUN_HOST }}
                  username: ${{ secrets.ALIYUN_USER }}
                  key: ${{ secrets.ALIYUN_KEY }}
                  source: "."
                                    target: "/opt/fiobot"
                  rm: false
                  strip_components: 0

            - name: Deploy using SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.ALIYUN_HOST }}
                  username: ${{ secrets.ALIYUN_USER }}
                  key: ${{ secrets.ALIYUN_KEY }}
                  script: |
                      set -e
                      echo "🚀 Starting deployment tasks..."

                      TARGET_DIR="/opt/fiobot"
                      VENV_DIR="/root/venv"

                      cd $TARGET_DIR

                      echo "✅ Code updated via SCP."

                      # 2.5 生成 .env 文件（从 GitHub Secrets 注入敏感配置）
                      echo "🔑 Generating .env file from secrets..."
                      cat > .env <<EOF
                      ENVIRONMENT=prod
                      DRIVER=~fastapi+~httpx+~websockets
                      BAIDU_OCR_API_KEY=${{ secrets.BAIDU_OCR_API_KEY }}
                      BAIDU_OCR_SECRET_KEY=${{ secrets.BAIDU_OCR_SECRET_KEY }}
                      EOF
                      # 去掉 heredoc 产生的前导空格
                      sed -i 's/^[[:space:]]*//' .env

                      echo "✅ .env file generated."

                      # 3. 设置虚拟环境 (适配您的服务器配置)
                      echo "🐍 Setting up virtual environment at $VENV_DIR..."
                      if [ ! -d "$VENV_DIR" ]; then
                          echo "Creating virtual environment..."
                          python3 -m venv $VENV_DIR
                      fi

                      # 使用指定虚拟环境中的 pip
                      PIP_CMD="$VENV_DIR/bin/pip"

                      echo "📦 Checking dependencies..."
                      if [ -f "requirements.txt" ]; then
                          echo "Found requirements.txt, installing..."
                          $PIP_CMD install -r requirements.txt
                      elif [ -f "pyproject.toml" ]; then
                          echo "Found pyproject.toml, installing..."
                          $PIP_CMD install .
                      else
                          echo "⚠️ No dependency file found, skipping installation."
                      fi

                      # 4. 重启服务
                      echo "🔄 Restarting application..."

                      if systemctl list-units --full -all | grep -Fq "fiobot.service"; then
                          systemctl restart fiobot
                          echo "✅ Systemd service 'fiobot' restarted."
                      else
                          echo "⚠️ Systemd service 'fiobot' not found."
                      fi

                      echo "🎉 Deployment completed successfully!"
